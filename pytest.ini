[pytest]
minversion = 7.0
testpaths = tests
python_files = test_*.py
python_classes = Test*
python_functions = test_*
addopts = -v --strict-markers --tb=short
markers =
    unit: unit test
    integration: integration test
    regression: regression test
    slow: slow running test
    asyncio: async test
asyncio_mode = auto
